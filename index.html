<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>أشكال الحرف</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;700&family=Readex+Pro:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#effaf8;--paper:#fff;--ink:#12302f;--muted:#5c7a78;--line:#d3ebe7;
  --p1:#0f766e;--p2:#14b8a6;--accent:#f43f5e;--accent-d:#be123c;
  --tile:#ccfbf1;--tile-edge:#0f766e;--tile-ink:#0b3d3a;
  --ok:#16a34a;--ok-soft:#dcfce7;--bad:#e11d48;--pic:#e0f2f1;--board:#fff;--shadow:0 10px 30px rgba(15,118,110,.12);
  --word:"Noto Naskh Arabic","Amiri",serif;--ui:"Readex Pro",Tahoma,system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#071a19;--paper:#0f2928;--ink:#e6f7f5;--muted:#8fb5b1;--line:#1c4442;--tile:#134e4a;--tile-edge:#2dd4bf;--tile-ink:#d9fffa;
  --ok-soft:#10361f;--pic:#12403d;--board:#0b2120;--shadow:0 10px 30px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#071a19;--paper:#0f2928;--ink:#e6f7f5;--muted:#8fb5b1;--line:#1c4442;--tile:#134e4a;--tile-edge:#2dd4bf;--tile-ink:#d9fffa;--ok-soft:#10361f;--pic:#12403d;--board:#0b2120;--shadow:0 10px 30px rgba(0,0,0,.4);color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--ui);
  padding:20px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));overflow-x:hidden}
#bgl{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bgl span{position:absolute;bottom:-90px;font-family:var(--word);font-weight:700;opacity:.09;animation:drift linear infinite}
@keyframes drift{from{transform:translateY(0) rotate(-10deg)}to{transform:translateY(calc(-100vh - 180px)) rotate(14deg)}}
.wrap{position:relative;z-index:1;max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-radius:20px;color:#fff;
  background:linear-gradient(120deg,var(--p1),var(--p2),var(--p1));background-size:200% 100%;animation:sheen 8s ease-in-out infinite;box-shadow:var(--shadow)}
@keyframes sheen{50%{background-position:100% 0}}
h1{margin:0;font-size:1.5rem;font-weight:700}
.score{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.18);padding:6px 14px;border-radius:999px;font-weight:600;font-variant-numeric:tabular-nums}
.score b{font-size:1.2rem;display:inline-block}
.score .star{display:inline-block}
.bump{animation:bump .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{40%{transform:scale(1.5) rotate(-8deg)}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--word);font-size:1.25rem;font-weight:700;min-width:44px;height:44px;padding:0 14px;border-radius:22px;border:2px solid var(--line);
  background:var(--paper);color:var(--ink);cursor:pointer;transition:transform .15s,background .2s,border-color .2s,color .2s}
.chip.all{font-family:var(--ui);font-size:.95rem}
.chip:hover{transform:translateY(-2px);border-color:var(--p2)}
.chip[aria-pressed="true"]{background:var(--p1);border-color:var(--p1);color:#fff;box-shadow:0 6px 14px rgba(15,118,110,.3)}
.chip:focus-visible,.tile:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:18px;box-shadow:var(--shadow)}
.card.enter>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.card.enter>*:nth-child(2){animation-delay:.05s}.card.enter>*:nth-child(3){animation-delay:.1s}
.card.enter>*:nth-child(4){animation-delay:.15s}.card.enter>*:nth-child(5){animation-delay:.2s}
.progress{align-self:stretch;display:flex;flex-direction:column;gap:8px;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.progress div:first-child{display:flex;justify-content:space-between}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p2),var(--p1));border-radius:99px;transition:width .6s cubic-bezier(.3,1,.4,1)}
.pic{align-self:stretch;height:150px;border-radius:16px;background:radial-gradient(circle at 50% 40%,var(--paper),var(--pic));display:grid;place-items:center;font-size:76px;line-height:1}
.pic span{display:inline-block;animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(3deg)}}
.board{position:relative;align-self:stretch;background:var(--board);border:3px solid var(--p2);border-radius:16px;padding:22px 12px 26px;display:flex;justify-content:center;align-items:center;min-height:120px;transition:background .3s,border-color .3s,box-shadow .3s}
.board.win{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 0 0 6px rgba(22,163,74,.15)}
.word{font-family:var(--word);font-size:clamp(2.6rem,11vw,3.6rem);font-weight:700;line-height:1.9;display:flex;align-items:center;white-space:nowrap}
.slot{display:inline-grid;place-items:center;min-width:1.5em;height:1.25em;margin:0 .06em;border:3px dashed var(--accent);border-radius:12px;transition:background .15s,transform .15s;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{background:rgba(244,63,94,.1)}}
.slot.hover{background:rgba(244,63,94,.2);transform:scale(1.08)}
.slot.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.full{display:inline-block;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.8);opacity:.4}100%{transform:scale(1);opacity:1}}
.hl{color:var(--accent)}
.hint{min-height:1.6em;font-weight:600;text-align:center;font-size:1.05rem;transition:color .2s}
.hint.ok{color:var(--ok)}.hint.bad{color:var(--bad)}
.tray{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.tile{font-family:var(--word);font-size:2.4rem;font-weight:700;min-width:84px;height:84px;padding:0 10px;border-radius:18px;border:2px solid var(--tile-edge);
  background:var(--tile);color:var(--tile-ink);box-shadow:0 6px 0 var(--tile-edge);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;line-height:1;
  transition:transform .15s,box-shadow .15s,opacity .2s;animation:tilein .5s cubic-bezier(.3,1.5,.5,1) both}
.tile:nth-child(2){animation-delay:.08s}.tile:nth-child(3){animation-delay:.16s}.tile:nth-child(4){animation-delay:.24s}
@keyframes tilein{from{opacity:0;transform:translateY(24px) scale(.8)}to{opacity:1;transform:none}}
.tile:hover{transform:translateY(-4px);box-shadow:0 10px 0 var(--tile-edge)}
.tile:active{cursor:grabbing;transform:translateY(3px);box-shadow:0 2px 0 var(--tile-edge)}
.tile.used{opacity:.35}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) scale(1.1) rotate(-4deg);box-shadow:0 14px 28px rgba(0,0,0,.28);animation:none}
.actions{display:flex;gap:10px;justify-content:center}
.btn{font-family:var(--ui);font-weight:600;font-size:1rem;padding:12px 28px;border-radius:14px;border:none;background:var(--p1);color:#fff;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 5px 0 #0a4f4a}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0a4f4a}
.btn.ghostbtn{background:transparent;color:var(--muted);border:2px solid var(--line);box-shadow:none}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-self:stretch;animation:rise .4s both}
.legend div{text-align:center;border:1px solid var(--line);border-radius:12px;padding:6px 4px;font-size:.78rem;color:var(--muted);transition:all .3s}
.legend div.on{border-color:var(--ok);background:var(--ok-soft);color:var(--ink);font-weight:600;transform:scale(1.05)}
.legend span{display:block;font-family:var(--word);font-size:1.5rem;color:var(--ink);line-height:1.6}
.note{color:var(--muted);font-size:.85rem;text-align:center;line-height:1.7;margin:0}
.done{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;width:100%}
.done .big{font-size:3rem;font-weight:700;color:var(--ok)}
.count{position:absolute;top:-22px;left:-14px;width:64px;height:64px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:2.1rem;display:grid;place-items:center;box-shadow:0 4px 0 var(--accent-d);border:3px solid var(--paper)}
.count.tick{animation:tick .9s ease-out}
@keyframes tick{0%{transform:scale(1.5);opacity:.3}25%{transform:scale(1);opacity:1}100%{transform:scale(.9)}}
.conf{position:absolute;left:50%;top:50%;width:10px;height:14px;border-radius:2px;pointer-events:none;z-index:5;animation:conf 1.1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes conf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.sign{text-align:center;color:var(--muted);font-size:.95rem;padding-top:12px;border-top:1px solid var(--line)}
.sign b{color:var(--p1);font-weight:700}
.sign .by{margin-top:6px}
.sign .brand{display:flex;align-items:center;justify-content:center;gap:12px}
.sign .logo{height:76px;width:auto;animation:float 3.2s ease-in-out infinite}
.sign .school{display:block;margin-top:0;font-weight:700;color:var(--ink);font-size:1.02rem}
@media (prefers-color-scheme:dark){.sign b{color:var(--p2)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}#bgl span{bottom:auto}}
</style></head>
<body>
<div id="bgl" aria-hidden="true"></div>

  <header>
    <h1>أشكال الحرف</h1>

 {l:'ب',p:'endC',w:'عِنَبٌ',b:'عِنَـ',a:'',img:'🍇'},
 {l:'ب',p:'endS',w:'كِتَابٌ',b:'كِتَا',a:'',img:'📖'},
 {l:'ل',p:'first',w:'لَيْمُونٌ',b:'',a:'ـيْمُونٌ',img:'🍋'},
 {l:'ل',p:'mid',w:'نَحْلَةٌ',b:'نَحْـ',a:'ـةٌ',img:'🐝'},
 {l:'ل',p:'endC',w:'فِيلٌ',b:'فِيـ',a:'',img:'🐘'},
 {l:'ل',p:'endS',w:'بُرْتُقَالٌ',b:'بُرْتُقَا',a:'',img:'🍊'},
 {l:'د',p:'first',w:'دُبٌّ',b:'',a:'بٌّ',img:'🐻'},
 {l:'د',p:'mid',w:'هَدِيَّةٌ',b:'هَـ',a:'يَّةٌ',img:'🎁'},
 {l:'د',p:'endC',w:'يَدٌ',b:'يَـ',a:'',img:'✋'},
 {l:'د',p:'endS',w:'وَرْدٌ',b:'وَرْ',a:'',img:'🌹'},
 {l:'ن',p:'first',w:'نَمْلَةٌ',b:'',a:'ـمْلَةٌ',img:'🐜'},
 {l:'ن',p:'mid',w:'عَنْكَبُوتٌ',b:'عَـ',a:'ـكَبُوتٌ',img:'🕷️'},
 {l:'ن',p:'endC',w:'عَيْنٌ',b:'عَيْـ',a:'',img:'👁️'},
 {l:'ن',p:'endS',w:'حِصَانٌ',b:'حِصَا',a:'',img:'🐴'},
 {l:'ر',p:'first',w:'رِيشَةٌ',b:'',a:'يشَةٌ',img:'🪶'},
 {l:'ر',p:'mid',w:'شَجَرَةٌ',b:'شَجَـ',a:'ةٌ',img:'🌳'},
 {l:'ر',p:'endC',w:'قَمَرٌ',b:'قَمَـ',a:'',img:'🌙'},
 {l:'ر',p:'endS',w:'نَارٌ',b:'نَا',a:'',img:'🔥'},
];
let filter='all',list=[],i=0,score=0,solved=false,tries=0,timer=null;
const $=s=>document.querySelector(s),card=$('#card');
const shuffle=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[a[k],a[r]]=[a[r],a[k]]}return a};

function chips(){
  const box=$('#chips');box.innerHTML='';
  [['all','كل الحروف'],...LETTERS.map(l=>[l,l])].forEach(([v,t])=>{
    const b=document.createElement('button');b.className='chip'+(v==='all'?' all':'');b.textContent=t;
    b.setAttribute('aria-pressed',filter===v);b.onclick=()=>{filter=v;start();chips()};box.appendChild(b);
  });
}
function start(){list=shuffle(WORDS.filter(w=>filter==='all'||w.l===filter));i=0;render();}

function render(){
  if(timer){clearInterval(timer);timer=null}
  solved=false;tries=0;
  card.classList.remove('enter');void card.offsetWidth;card.classList.add('enter');
  if(i>=list.length){
    card.innerHTML=`<div class="done"><div class="pic" style="width:100%"><span>🏆</span></div><div class="big">${score}</div><div>أحسنت! أنهيت ${list.length} كلمات.</div><button class="btn" id="again">العب مرة أخرى</button></div>`;
    $('#again').onclick=()=>{score=0;$('#score').textContent=0;start()};burst(card);return;
  }
  const q=list[i],f=forms(q.l),tiles=shuffle([...new Set(Object.values(f))]);
  card.innerHTML=`
    <div class="progress"><div><span>الكلمة ${i+1} من ${list.length}</span><span>حرف ${q.l}</span></div><div class="bar"><i style="width:${i/list.length*100}%"></i></div></div>
    <div class="pic" aria-hidden="true"><span>${q.img}</span></div>
    <div class="board" id="board"><div class="word" id="word"><span>${q.b}</span><span class="slot" id="slot" aria-label="فراغ"></span><span>${q.a}</span></div></div>
    <div class="hint" id="hint">أين يقع الحرف ${q.l} في الكلمة؟</div>
    <div class="tray" id="tray">${tiles.map(t=>`<button class="tile" data-v="${t}">${t}</button>`).join('')}</div>
    <div class="legend" id="legend" hidden>${Object.keys(POS).map(k=>`<div data-k="${k}"><span>${f[k]}</span>${POS[k]}</div>`).join('')}</div>
    <div class="actions"><button class="btn ghostbtn" id="skip">تخطَّ</button><button class="btn" id="next" hidden>التالي</button></div>`;
  requestAnimationFrame(()=>{const bar=card.querySelector('.bar i');if(bar)bar.style.width=((i+0.001)/list.length*100)+'%'});
  card.querySelectorAll('.tile').forEach(bindDrag);
  $('#next').onclick=()=>{i++;render()};
  $('#skip').onclick=()=>{i++;render()};
}

function burst(host){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cols=['#14b8a6','#f43f5e','#fbbf24','#38bdf8','#a78bfa'];
  for(let k=0;k<26;k++){
    const e=document.createElement('i');e.className='conf';
    const a=Math.random()*Math.PI*2,d=90+Math.random()*130;
    e.style.background=cols[k%cols.length];
    e.style.setProperty('--x',Math.cos(a)*d+'px');e.style.setProperty('--y',(Math.sin(a)*d-40)+'px');
    e.style.setProperty('--r',(Math.random()*720-360)+'deg');
    host.appendChild(e);setTimeout(()=>e.remove(),1200);
  }
}

function check(v,tile){
  if(solved)return;
  const q=list[i],ans=forms(q.l)[q.p],slot=$('#slot'),hint=$('#hint');
  tries++;
  if(v===ans){
    solved=true;
    if(tries===1){score++;const s=$('#score');s.textContent=score;s.classList.remove('bump');void s.offsetWidth;s.classList.add('bump')}
    const pre=q.b.replace(/ـ$/,''),suf=q.a.replace(/^ـ/,''),mid=q.w.slice(pre.length,q.w.length-suf.length);
    $('#word').innerHTML=`<span class="full">${pre}<span class="hl">${mid}</span>${suf}</span>`;
    $('#board').classList.add('win');
    hint.className='hint ok';hint.textContent=`أحسنت! الحرف ${q.l} في ${POS[q.p]}`;
    card.querySelectorAll('.tile').forEach(t=>t.classList.toggle('used',t.dataset.v!==v));
    const lg=$('#legend');lg.hidden=false;lg.querySelector(`[data-k="${q.p}"]`).classList.add('on');
    $('#skip').hidden=true;const nx=$('#next');nx.hidden=false;nx.focus();
    burst($('#board'));
    const ar=['٠','١','٢','٣'];let left=3;
    const cd=document.createElement('div');cd.className='count';cd.setAttribute('aria-live','polite');
    const show=()=>{cd.textContent=ar[left];cd.classList.remove('tick');void cd.offsetWidth;cd.classList.add('tick')};
    $('#board').appendChild(cd);show();
    timer=setInterval(()=>{left--;if(left<=0){clearInterval(timer);timer=null;i++;render()}else show()},1000);
  }else{
    slot.classList.remove('shake');void slot.offsetWidth;slot.classList.add('shake');
    hint.className='hint bad';hint.textContent='حاول مرة أخرى، انظر إلى موقع الفراغ في الكلمة';
    if(tile)tile.classList.add('used');
  }
}

function bindDrag(tile){
  let ghost=null,sx=0,sy=0,moved=false;
  const over=(x,y)=>{const s=$('#slot');if(!s)return false;const r=s.getBoundingClientRect();return x>r.left-20&&x<r.right+20&&y>r.top-20&&y<r.bottom+20};
  tile.addEventListener('pointerdown',e=>{if(solved)return;sx=e.clientX;sy=e.clientY;moved=false;tile.setPointerCapture(e.pointerId)});
  tile.addEventListener('pointermove',e=>{
    if(!tile.hasPointerCapture(e.pointerId))return;
    if(!moved&&Math.hypot(e.clientX-sx,e.clientY-sy)>8){moved=true;ghost=tile.cloneNode(true);ghost.classList.add('ghost');document.body.appendChild(ghost)}
    if(ghost){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';$('#slot')?.classList.toggle('hover',over(e.clientX,e.clientY))}
  });
  tile.addEventListener('pointerup',e=>{
    if(!tile.hasPointerCapture(e.pointerId))return;tile.releasePointerCapture(e.pointerId);
    $('#slot')?.classList.remove('hover');
    if(ghost){ghost.remove();ghost=null;if(over(e.clientX,e.clientY))check(tile.dataset.v,tile)}
    else if(!moved)check(tile.dataset.v,tile);
  });
  tile.addEventListener('pointercancel',()=>{ghost&&ghost.remove();ghost=null;$('#slot')?.classList.remove('hover')});
  tile.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();check(tile.dataset.v,tile)}});
  tile.addEventListener('click',e=>e.preventDefault());
}

(function(){
  const box=$('#bgl'),ch='مبلدنرأتجسعقكهيوصط',cols=['#0f766e','#14b8a6','#f43f5e'];
  for(let k=0;k<20;k++){
    const e=document.createElement('span');e.textContent=ch[Math.floor(Math.random()*ch.length)];
    e.style.left=(Math.random()*95)+'%';e.style.fontSize=(32+Math.random()*60)+'px';e.style.color=cols[k%3];
    const d=20+Math.random()*22;e.style.animationDuration=d+'s';e.style.animationDelay=(-Math.random()*d)+'s';
    box.appendChild(e);
  }
})();
chips();start();
</script>
